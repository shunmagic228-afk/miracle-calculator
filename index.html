utton><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="−" aria-label="引く"><svg class="operator-symbol" viewBox="0 0 48 48" aria-hidden="true"><path d="M9 24h30"/></svg></button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+" aria-label="足す"><svg class="operator-symbol" viewBox="0 0 48 48" aria-hidden="true"><path d="M9 24h30M24 9v30"/></svg></button><button data-key="±">⁺∕₋</button><button data-key="0">0</button><button data-key=".">.</button><button class="operator" data-key="=" aria-label="イコール"><svg class="operator-symbol" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 17h26M11 31h26"/></svg></button></div></main><dialog id="panel"><div class="panelhead"><h2 id="paneltitle">設定</h2><button id="close">完了</button></div><div id="config"><label for="peekmode">カンニング表示</label><select id="peekmode"><option value="normal">ノーマルモード</option><option value="peek">カンニングモード</option></select><p>カンニングモードでは、今＝を押した場合の時刻を4桁で表示します。1回目の＝で表示が消えます。</p><label for="delay">1回目の＝から何秒後の日時にするか</label><div class="delaycontrol"><output id="delayvalue" for="delay" aria-live="polite"></output><input id="delay" type="range" min="10" max="300" step="10" value="30"><div class="rangeends"><span>10秒</span><span>5分</span></div></div><p>端末の日時を使います。1回目の＝で日時を確定します。</p><p>計算開始前に「%」でマジックON／OFF。左上の丸の中の点がONの目印です。</p><p>1回目の＝では答えを表示。次のタップで必要な＋／−を表示し、その次から必要な数字を1桁ずつ入力。入力が揃ったら＝で結果を表示します。途中の＝も数字入力として扱います。</p><button id="reset" class="reset">演技をリセット（モードは維持）</button><p id="offline">オフライン用データを準備中…</p><p>Safariの共有 →「ホーム画面に追加」</p></div><div id="historylist" hidden></div></dialog><script src="engine.js"></script><script src="app.js"></script></body></html>
